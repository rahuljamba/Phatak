services:
  - type: web
    name: phatak-punjab
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV_MODE
        value: dev
      - key: FIREBASE_API_KEY
        value: AIzaSyAMSVpPM1x3w68qCRrxQ-RXthvM5NsCLt4
      - key: FIREBASE_AUTH_DOMAIN
        value: multichatnew.firebaseapp.com
      - key: FIREBASE_PROJECT_ID
        value: multichatnew
      - key: FIREBASE_STORAGE_BUCKET
        value: multichatnew.firebasestorage.app
      - key: FIREBASE_MESSAGING_SENDER_ID
        value: "500154591134"
      - key: FIREBASE_APP_ID
        value: 1:500154591134:web:4d0fcf5eee5c57bd01588f
